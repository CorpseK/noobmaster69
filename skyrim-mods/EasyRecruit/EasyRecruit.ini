; EasyRecruit - NPC co relationship voi player tu Friend tro len se rui duoc lam follower.
; Sua xong phai khoi dong lai game.

[General]
; Relationship toi thieu: 1 Friend, 2 Confidant, 3 Ally, 4 Lover.
; Dat thap hon 1 khong co tac dung: cau thoai "Follow me" cua game van can Friend.
iMinRank=1
; 1 = hien thong bao goc trai man hinh khi mot NPC rui duoc
bNotify=1
; 1 = bo qua tre em
bSkipChildren=1
; 1 = bo qua NPC dang thu dich voi player
bSkipHostile=1
; 1 = ghi log moi lan noi chuyen (de test)
bVerboseLog=0

[Exclude]
; NPC khong bao gio bi them vao. Moi dong: TenTuyY=Plugin.esp|FormID (FormID cua base NPC, bo 2 so dau load order).
; Vi du:
;TenNPC=Skyrim.esm|0x012345
