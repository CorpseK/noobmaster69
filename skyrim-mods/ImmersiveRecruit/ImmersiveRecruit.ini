; Immersive Recruit - any NPC who becomes your Friend (or better) can be recruited as a follower.
; Restart the game after editing this file.

[General]
; Minimum relationship rank: 1 Friend, 2 Confidant, 3 Ally, 4 Lover.
; Values below 1 do nothing: the vanilla "Follow me" line still requires Friend.
iMinRank=1
; 1 = show a notification when an NPC becomes recruitable or stronger
bNotify=1
; 1 = ignore children
bSkipChildren=1
; 1 = ignore NPCs that are hostile to the player
bSkipHostile=1
; 1 = log every activation/conversation to Documents/My Games/Skyrim Special Edition/SKSE/ImmersiveRecruit.log
bVerboseLog=0

[Follower]
; Applied to an NPC in PotentialFollowerFaction while they are following you
; (a few seconds after recruiting them, and on every save load).
; Changes are stored in your save and stay even if you uninstall the mod.

; 1 = level with the player (same as NFF's nfflevel: setlevel 1000 0 1 0).
bScaleWithPlayer=1
; Follower level = player level * this / 100 (10-500).
iLevelMultPercent=100
; 1 = never drop below the NPC's original level.
bKeepCurrentLevelAsMin=1
; Maximum level, 0 = no cap. NPCs whose own level is already higher keep their level.
iMaxLevel=80
; 1 = NPCs that already level with the player but stop early (e.g. capped at 25)
;     get their cap raised to iMaxLevel. Their multiplier and minimum level are kept.
bRemoveLevelCap=1
; 1 = Protected: only the player can kill them. Essential NPCs stay Essential.
bProtected=1
; 1 = only unique NPCs (generic NPCs share one base record, editing it would change them all).
bOnlyUnique=1

[Exclude]
; NPCs that are never touched by this mod. One per line: AnyName=Plugin.esp|FormID
; FormID = base NPC form ID without the load order prefix.
; Example:
;Brynjolf=Skyrim.esm|0x01B07D
