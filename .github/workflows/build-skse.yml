name: Build SKSE plugins

on:
  push:
    paths:
      - "skyrim-mods/**"
      - ".github/workflows/build-skse.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.mod }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [SpellBuffs, LightPockets, GMSTTweaks, KillRestore, EasyRecruit, GenderShift, RelicHunter, TNGPlayerOnly]
    env:
      VCPKG_COMMIT: 5d4a3dc90c0b3773f3bac81bf41297b54328f471
      # Built vcpkg packages are kept between runs (faster, fewer download failures).
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles(format('skyrim-mods/{0}/vcpkg.json', matrix.mod)) }}
          restore-keys: vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        working-directory: skyrim-mods/${{ matrix.mod }}
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        working-directory: skyrim-mods/${{ matrix.mod }}
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $mod = "${{ matrix.mod }}"
          New-Item -ItemType Directory -Force out/SKSE/Plugins | Out-Null
          Copy-Item "skyrim-mods/$mod/build/Release/$mod.dll" out/SKSE/Plugins/
          if (Test-Path "skyrim-mods/$mod/$mod.ini") {
            Copy-Item "skyrim-mods/$mod/$mod.ini" out/SKSE/Plugins/
          }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.mod }}
          path: out
